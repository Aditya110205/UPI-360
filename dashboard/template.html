<title>UPI 360</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: icon rail + header with date filters; Market view mirrors the reference (KPI stack, hero chart, three cards). */
:root{--bg:#eef0ef;--card:#ffffff;--ink:#13201f;--muted:#6b7978;--line:#e4e8e7;--teal:#0d5c5c;--teal-soft:#d5e6e4;--amber:#f0b643;--coral:#ee8a80;--grid:#e9eceb;--bar:#dfe4e3;--shadow:0 1px 2px rgba(19,32,31,.04),0 6px 20px rgba(19,32,31,.04);--band:rgba(13,92,92,.12);--font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1514;--card:#172120;--ink:#e8f0ee;--muted:#8fa09d;--line:#243230;--teal:#52b8b0;--teal-soft:#1e3533;--amber:#f0b643;--coral:#f0958c;--grid:#223130;--bar:#2a3836;--shadow:none;--band:rgba(82,184,176,.16);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1514;--card:#172120;--ink:#e8f0ee;--muted:#8fa09d;--line:#243230;--teal:#52b8b0;--teal-soft:#1e3533;--amber:#f0b643;--coral:#f0958c;--grid:#223130;--bar:#2a3836;--shadow:none;--band:rgba(82,184,176,.16);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:76px minmax(0,1fr);gap:20px}
.num{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
/* nav */
.rail{display:flex;flex-direction:column;gap:6px;align-items:center;background:var(--card);border-radius:20px;padding:12px 8px;box-shadow:var(--shadow);align-self:start;position:sticky;top:20px}
.rail .logo{font-weight:800;font-size:12px;letter-spacing:.04em;color:var(--teal);padding:6px 0 10px}
.nav{width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border:0;border-radius:14px;background:transparent;color:var(--muted);cursor:pointer;font-size:10.5px;font-weight:600}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:var(--teal-soft)}
.nav[aria-current="page"]{background:var(--teal);color:#fff}
:root[data-theme="dark"] .nav[aria-current="page"]{color:#0f1514}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav[aria-current="page"]{color:#0f1514}}
/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:12.5px}
.sel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0f1514}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0f1514}}
/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--ink)}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}.kpis .card{flex:1}
.kpi{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kpi .lbl{font-size:13px;color:var(--muted);margin-bottom:8px}
.kpi .val{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;letter-spacing:-.01em}
.ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 8px;margin-top:6px}
.up{background:var(--teal-soft);color:var(--teal)}.dn{background:rgba(238,138,128,.2);color:var(--coral)}
.bars{display:flex;align-items:flex-end;gap:5px;height:54px;flex:none}
.bars i{display:block;width:7px;border-radius:4px;background:var(--bar)}
.hero-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em}
.big small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.right{text-align:right}.right b{display:block;font-size:20px;color:var(--teal)}.right span{font-size:12px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 6px}
.tick{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
.chartbox{position:relative;height:300px}
.chartbox.sm{height:240px}
.spk{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.spk+.spk{border-top:1px solid var(--line);margin-top:8px;padding-top:14px}
.spk b{display:block;font-size:22px}.spk span{font-size:12.5px;color:var(--muted)}
.spk svg{width:120px;height:44px;flex:none}
.prog{display:flex;align-items:center;gap:14px;margin-top:8px}.prog b{font-size:22px}
.track{flex:1;height:8px;border-radius:8px;background:var(--bar);overflow:hidden}.track i{display:block;height:100%;background:var(--teal);border-radius:8px}
.list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.list li:first-child{border-top:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.list .t{flex:1;min-width:0}.list .w{color:var(--muted);font-size:12px;white-space:nowrap}
.bub{position:relative;height:180px;margin:6px 0 12px;overflow:hidden}
.bub div{position:absolute;border-radius:50%;display:grid;place-items:center;font-weight:700}
.foot{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:12px;text-align:center}
.foot b{display:block;font-size:17px}.foot span{font-size:12px;color:var(--muted)}
.foot>div+div{border-left:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:600;color:var(--muted);text-align:left;font-size:12px;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.note{color:var(--muted);font-size:12.5px;margin:6px 0 0;max-width:70ch}
.stat{font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--teal)}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700}
.mbar{display:flex;align-items:center;gap:8px}.mbar .track{flex:1;min-width:60px}
/* ask */
.askrow{display:flex;gap:10px;flex-wrap:wrap}
.askrow input{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.btn{border:0;border-radius:12px;background:var(--teal);color:#fff;font-weight:700;padding:12px 18px;cursor:pointer}
:root[data-theme="dark"] .btn{color:#0f1514}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0f1514}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.chips button:hover{background:var(--teal-soft)}
.qa{border-top:1px solid var(--line);padding:14px 0}
.qa:first-child{border-top:0}
.qa .q{color:var(--muted);font-size:12.5px}.qa .a{font-size:16px;font-weight:600;margin:3px 0}.qa .h{font-size:12px;color:var(--muted)}
@media (max-width:1000px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
@media (max-width:820px){
 .shell{grid-template-columns:minmax(0,1fr);gap:14px}
 .rail{flex-direction:row;position:static;overflow-x:auto;justify-content:flex-start;border-radius:16px;padding:6px}
 .rail .logo{padding:0 10px}.nav{width:auto;min-width:64px;flex:none;padding:8px 10px}
 h1{font-size:22px}.big{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
 <nav class="rail" id="rail" aria-label="Views"></nav>
 <main>
  <div class="top">
   <div><h1 id="title">Market</h1><div class="sub" id="subtitle"></div></div>
   <div class="filters" id="filters">
    <span>Showing data for</span>
    <select class="sel" id="from" aria-label="From month"></select><span>to</span><select class="sel" id="to" aria-label="To month"></select>
    <span class="seg" id="presets"><button data-p="all">All</button><button data-p="36">3 yrs</button><button data-p="12">12 mo</button></span>
   </div>
  </div>
  <div id="view"></div>
 </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const D = /*DATA*/null;
const M = D.months, N = M.length;
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MFULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const lab = d => MN[+d.slice(5)-1]+' '+d.slice(2,4);
const labL = d => MN[+d.slice(5)-1]+' '+d.slice(0,4);
const fV = v => v>=1000 ? (v/1000).toFixed(2)+'B' : v>=100 ? Math.round(v).toLocaleString('en-IN')+'M' : v.toFixed(1)+'M';
const fC = c => c>=1e5 ? '₹'+(c/1e5).toFixed(1)+' L Cr' : '₹'+Math.round(c).toLocaleString('en-IN')+' Cr';
const fT = t => '₹'+Math.round(t).toLocaleString('en-IN');
const fP = (p,d=1) => (p>0?'+':'')+p.toFixed(d)+'%';
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = s => document.querySelector(s);
const yoyAt = i => i>=12 ? (M[i].v/M[i-12].v-1)*100 : null;
const S = {view:'market', from:0, to:N-1, metric:'v', log:false, fc:true, qa:[]};
const VIEWS = {
 market:['Market','Volume, value and banks on UPI','<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'],
 behaviour:['Behaviour','Seasonality, ticket size and growth phases','<path d="M3 12c3-6 5-6 7 0s4 6 7 0 3-4 4-3"/>'],
 forecast:['Forecast','Holdout test and the next six months','<path d="M3 17l5-5 4 3 8-9M15 6h5v5"/>'],
 risk:['Risk','Months where growth broke from its own trend','<path d="M12 3l10 18H2zM12 10v5M12 18h.01"/>'],
 ask:['Ask the Data','Plain-English questions answered from this data','<path d="M21 12a8 8 0 0 1-12 7l-5 1 1-4a8 8 0 1 1 16-4z"/>']
};
let charts = [];
function mk(id, cfg){ const el = document.getElementById(id); if(!el) return; const c = new Chart(el, cfg); charts.push(c); return c; }
function killCharts(){ charts.forEach(c=>c.destroy()); charts=[]; }
const vline = {id:'vline', afterDatasetsDraw(c){ const a=c.tooltip&&c.tooltip.getActiveElements(); if(!a||!a.length) return; const x=a[0].element.x, ca=c.chartArea, g=c.ctx; g.save(); g.strokeStyle=css('--teal'); g.lineWidth=1.5; g.beginPath(); g.moveTo(x,ca.top); g.lineTo(x,ca.bottom); g.stroke(); g.restore(); }};
function base(extra={}){
 return Object.assign({responsive:true, maintainAspectRatio:false, animation:{duration:250}, interaction:{mode:'index',intersect:false},
  plugins:{legend:{display:false}, tooltip:{backgroundColor:css('--card'), titleColor:css('--ink'), bodyColor:css('--ink'), borderColor:css('--line'), borderWidth:1, padding:10, displayColors:true, boxPadding:4, titleFont:{family:css('--font'),weight:'700'}, bodyFont:{family:css('--font')}}},
  scales:{x:{grid:{display:false}, border:{display:false}, ticks:{color:css('--muted'), maxTicksLimit:8, autoSkip:true, maxRotation:0, font:{family:css('--font'),size:11}}},
          y:{grid:{color:css('--grid')}, border:{display:false}, ticks:{color:css('--muted'), maxTicksLimit:6, font:{family:css('--font'),size:11}}}}}, extra);
}
const rng = () => M.slice(S.from, S.to+1);
function spark(vals, color){
 const v = vals.filter(x=>x!=null); if(v.length<2) return '<svg viewBox="0 0 120 44"></svg>';
 const mn=Math.min(...v), mx=Math.max(...v), sp=(mx-mn)||1;
 const pts = vals.map((x,i)=> x==null?null:[(i/(vals.length-1))*116+2, 40-((x-mn)/sp)*36]).filter(Boolean);
 return '<svg viewBox="0 0 120 44" aria-hidden="true"><polyline fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/></svg>';
}
function miniBars(vals, color){
 const v = vals.slice(-8), mx=Math.max(...v), mn=Math.min(...v), sp=(mx-mn)||1;
 return '<div class="bars" aria-hidden="true">'+v.map((x,i)=>'<i style="height:'+(26+((x-mn)/sp)*74)+'%;'+(i===v.length-1?'background:'+color:'')+'"></i>').join('')+'</div>';
}
const chipYoy = i => { const y=yoyAt(i); return y==null ? '' : '<span class="chip '+(y>=0?'up':'dn')+'">'+fP(y)+' vs last year</span>'; };
function milestones(){
 const ev=[]; const first=(f,t)=>{const i=M.findIndex(f); if(i>=0) ev.push({i,t:t(M[i]),c:'--teal'});};
 [[100,'100M'],[1000,'1B'],[10000,'10B'],[20000,'20B']].forEach(([x,l])=>first(m=>m.v>=x,m=>'First month above '+l+' transactions'));
 [[100,'100'],[500,'500'],[700,'700']].forEach(([x,l])=>first(m=>m.b>=x,m=>'Banks live passed '+l));
 const pk=M.reduce((a,m,i)=>m.v>M[a].v?i:a,0); ev.push({i:pk,t:'Record month: '+fV(M[pk].v),c:'--amber'});
 D.anomalies.filter(a=>a.f).forEach(a=>{const i=idx(a.d); ev.push({i,t:'Flag: volume '+fP(a.mom)+' vs trend '+fP(a.trend),c:'--coral'});});
 return ev.filter(e=>e.i>=S.from&&e.i<=S.to).sort((a,b)=>b.i-a.i);
}
const idx = d => M.findIndex(m=>m.d===d);
const COL = {v:{k:'v',name:'Volume',f:fV}, c:{k:'c',name:'Value',f:fC}, t:{k:'t',name:'Avg ticket size',f:fT}};

/* ------------------------------ views ------------------------------ */
function vMarket(){
 const r=rng(), last=r[r.length-1], first=r[0], li=S.to;
 const yrs=Math.max((idx(last.d)-idx(first.d))/12, 1/12);
 const mt=COL[S.metric], L=last[mt.k], F=first[mt.k];
 const cagr=(Math.pow(L/F,1/yrs)-1)*100, big = r.length>=13;
 const showFc = S.metric==='v' && S.fc && S.to===N-1;
 $('#view').innerHTML = `<div class="grid">
 <div class="stack c4 kpis">
  <div class="card kpi"><div><div class="lbl">Monthly volume</div><div class="val num"><span class="ico" style="background:var(--teal-soft);color:var(--teal)"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span>${fV(last.v)}</div>${chipYoy(li)}</div>${miniBars(r.map(m=>m.v),css('--teal'))}</div>
  <div class="card kpi"><div><div class="lbl">Value processed</div><div class="val num"><span class="ico" style="background:rgba(240,182,67,.22);color:var(--amber)"><svg viewBox="0 0 24 24"><path d="M6 4h12M6 9h12M9 4c6 0 6 9 0 9l7 7"/></svg></span>${fC(last.c)}</div><span class="chip up" style="background:rgba(240,182,67,.2);color:var(--amber)">${fT(last.t)} per payment</span></div>${miniBars(r.map(m=>m.c),css('--amber'))}</div>
  <div class="card kpi"><div><div class="lbl">Banks live</div><div class="val num"><span class="ico" style="background:rgba(238,138,128,.2);color:var(--coral)"><svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/></svg></span>${last.b}</div><span class="chip dn">${(last.b/first.b).toFixed(1)}x since ${labL(first.d)}</span></div>${miniBars(r.map(m=>m.b),css('--coral'))}</div>
 </div>
 <div class="card c8">
  <div class="hero-h"><div><h2>${mt.name} by month</h2><div class="big num">${mt.f(L)}<small>from ${mt.f(F)} (${lab(first.d)})</small></div></div>
   <div class="right"><b class="num">${big?cagr.toFixed(1)+'%':fP((L/F-1)*100)}</b><span>${big?'CAGR over range':'change over range'}</span></div></div>
  <div class="tools"><span class="seg" id="metricSeg">${Object.entries(COL).map(([k,c])=>`<button data-m="${k}" aria-pressed="${S.metric===k}">${c.name}</button>`).join('')}</span>
   <label class="tick"><input type="checkbox" id="log" ${S.log?'checked':''}> Log scale</label>
   ${S.metric==='v'?`<label class="tick"><input type="checkbox" id="fc" ${S.fc?'checked':''}> Forecast</label>`:''}</div>
  <div class="chartbox"><canvas id="main" role="img" aria-label="${mt.name} by month"></canvas></div>
 </div>
 <div class="stack c4">
  <div class="card">
   <div class="spk"><div><span>Avg ticket size</span><b class="num">${fT(last.t)}</b></div>${spark(r.slice(-36).map(m=>m.t),css('--teal'))}</div>
   <div class="spk"><div><span>Growth vs last year</span><b class="num">${yoyAt(li)==null?'n/a':fP(yoyAt(li))}</b></div>${spark(r.slice(-36).map(m=>yoyAt(idx(m.d))),css('--coral'))}</div>
  </div>
  <div class="card"><h2>Holdout forecast accuracy</h2><div class="prog"><b class="num">${(100-D.holdout.mape[D.holdout.best]).toFixed(1)}%</b><div class="track"><i style="width:${100-D.holdout.mape[D.holdout.best]}%"></i></div></div><p class="note">1 minus MAPE on the last 6 months, which the model never saw.</p></div>
 </div>
 <div class="card c4"><h2>Milestones and flags</h2><ul class="list">${milestones().slice(0,8).map(e=>`<li><span class="dot" style="background:var(${e.c})"></span><span class="t">${e.t}</span><span class="w">${labL(M[e.i].d)}</span></li>`).join('')||'<li><span class="t">Nothing notable in this range.</span></li>'}</ul></div>
 <div class="card c4"><h2>Growth phases</h2>${phaseBubbles()}</div>
 </div>`;
 drawMain(showFc);
 document.querySelectorAll('#metricSeg button').forEach(b=>b.onclick=()=>{S.metric=b.dataset.m; render();});
 const lg=$('#log'); if(lg) lg.onchange=()=>{S.log=lg.checked; render();};
 const fcb=$('#fc'); if(fcb) fcb.onchange=()=>{S.fc=fcb.checked; render();};
}
function phaseBubbles(){
 const P=D.phases, tot=P.reduce((a,p)=>a+p.months,0), by=n=>P.find(p=>p.name===n);
 const cfg=[['Mature','--teal',150,40,0,'#fff'],['Scale-up','--coral',96,6,82,'#13201f'],['Launch & ramp-up','--amber',72,74,104,'#13201f']];
 return `<div class="bub">${cfg.map(([n,c,s,l,t,fg])=>{const p=by(n);return `<div style="width:${s}px;height:${s}px;left:${l}%;top:${t}px;background:var(${c});color:${fg}" title="${n}: ${p.from} to ${p.to}">${Math.round(p.months/tot*100)}%</div>`}).join('')}</div>
 <div class="foot">${P.map(p=>`<div><b class="num">${p.months}</b><span>${p.name.split(' ')[0]}</span></div>`).join('')}</div>`;
}
function drawMain(showFc){
 const r=rng(), mt=COL[S.metric]; let labels=r.map(m=>lab(m.d)); const act=r.map(m=>m[mt.k]);
 const ds=[{label:mt.name,data:act.slice(),borderColor:css('--teal'),backgroundColor:css('--band'),borderWidth:2.2,pointRadius:0,pointHoverRadius:5,pointBackgroundColor:css('--card'),pointBorderColor:css('--teal'),pointBorderWidth:2,tension:.25,fill:{target:'origin',above:css('--band')}}];
 if(showFc){
  const f=D.forecast, n=act.length; labels=labels.concat(f.map(x=>lab(x.d)));
  const pad=(arr,start)=>Array(n-1).fill(null).concat([start],arr);
  ds[0].data=act.concat(Array(f.length).fill(null)); ds[0].fill=false;
  ds.push({label:'Forecast',data:pad(f.map(x=>x.f),act[n-1]),borderColor:css('--teal'),borderDash:[5,4],borderWidth:2,pointRadius:0,pointHoverRadius:5,tension:.25,fill:false});
  ds.push({label:'Low',data:pad(f.map(x=>x.lo),act[n-1]),borderWidth:0,pointRadius:0,fill:false,tension:.25,_band:1});
  ds.push({label:'High',data:pad(f.map(x=>x.hi),act[n-1]),borderWidth:0,pointRadius:0,fill:'-1',backgroundColor:css('--band'),tension:.25,_band:1});
 }
 const o=base({plugins:{legend:{display:false},tooltip:{backgroundColor:css('--card'),titleColor:css('--ink'),bodyColor:css('--ink'),borderColor:css('--line'),borderWidth:1,padding:10,filter:i=>!i.dataset._band,callbacks:{label:c=>c.dataset.label+': '+mt.f(c.parsed.y)}}}});
 o.scales.y.ticks.callback=v=>S.metric==='v'?(v>=1000?+(v/1000).toFixed(1)+'B':+v.toFixed(0)+'M'):mt.f(v); if(S.log) o.scales.y.type='logarithmic';
 mk('main',{type:'line',data:{labels,datasets:ds},options:o,plugins:[vline]});
}
function vBehaviour(){
 const sv=D.season, f=D.festive, r=rng();
 $('#view').innerHTML=`<div class="grid">
 <div class="card c7"><h2>Seasonality, trend removed</h2><p class="note">Each bar is the average of a month's volume divided by its centred 12-month average, across all years. Above 1.00 means busier than the year around it.</p><div class="chartbox sm"><canvas id="seas" role="img" aria-label="Seasonality index by month"></canvas></div></div>
 <div class="card c5"><h2>Festive quarter test</h2><div class="stat num">${f.festive_mean.toFixed(3)}</div><p class="note">Oct to Dec index versus <b class="num">${f.other_mean.toFixed(3)}</b> for the other nine months, ${((f.festive_mean/f.other_mean-1)*100).toFixed(1)}% higher. Mann-Whitney ${f.p<0.001?'p &lt; 0.001':'p = '+f.p.toFixed(3)}.</p><p class="note">Raw month averages mislead here because volume grew about 3,300 times, so a month's average mostly reflects which years it appears in. Removing the trend first shows the real pattern: strongest in December, weakest in June.</p></div>
 <div class="card c6"><h2>Average ticket size</h2><p class="note">Value per transaction in rupees, ${labL(r[0].d)} to ${labL(r[r.length-1].d)}.</p><div class="chartbox sm"><canvas id="tick" role="img" aria-label="Average ticket size"></canvas></div></div>
 <div class="card c6"><h2>Growth versus a year earlier</h2><p class="note">Volume change against the same month last year.</p><div class="chartbox sm"><canvas id="yoy" role="img" aria-label="Year on year growth"></canvas></div></div>
 <div class="card c12"><h2>Growth phases</h2><div class="scroll"><table><thead><tr><th>Phase</th><th>Months</th><th>Period</th><th>Avg volume</th><th>Avg ticket</th></tr></thead><tbody>${D.phases.map(p=>`<tr><td><b>${p.name}</b></td><td class="num">${p.months}</td><td>${p.from} to ${p.to}</td><td class="num">${fV(p.avg_volume)}</td><td class="num">${fT(p.avg_ticket)}</td></tr>`).join('')}</tbody></table></div><p class="note">K-means with three clusters on log volume. Phases describe the market's stage, not groups of users, because the data is monthly totals.</p></div></div>`;
 const o=base(); o.scales.y.ticks.callback=v=>v.toFixed(2); o.scales.y.min=0.9;
 o.plugins.tooltip.callbacks={label:c=>'Index '+c.parsed.y.toFixed(3)}; o.scales.x.ticks.autoSkip=false;
 mk('seas',{type:'bar',data:{labels:MN,datasets:[{data:MN.map((_,i)=>sv[i+1]),borderRadius:6,backgroundColor:MN.map((_,i)=>sv[i+1]>=1?css('--teal'):css('--coral'))}]},options:o});
 const o2=base(); o2.scales.y.ticks.callback=v=>fT(v); o2.plugins.tooltip.callbacks={label:c=>fT(c.parsed.y)};
 mk('tick',{type:'line',data:{labels:r.map(m=>lab(m.d)),datasets:[{data:r.map(m=>m.t),borderColor:css('--teal'),borderWidth:2.2,pointRadius:0,pointHoverRadius:5,tension:.25}]},options:o2,plugins:[vline]});
 const o3=base(); o3.scales.y.ticks.callback=v=>v+'%'; o3.plugins.tooltip.callbacks={label:c=>c.parsed.y==null?'n/a':fP(c.parsed.y)};
 const yv=r.map(m=>{const y=yoyAt(idx(m.d)); return y==null?null:Math.min(y,400);});
 if(Math.max(...yv.filter(x=>x!=null),0)>=400) o3.plugins.subtitle={display:true,text:'Capped at 400% for readability',color:css('--muted'),align:'end',font:{size:11}};
 mk('yoy',{type:'line',data:{labels:r.map(m=>lab(m.d)),datasets:[{data:yv,borderColor:css('--coral'),borderWidth:2.2,pointRadius:0,pointHoverRadius:5,tension:.25}]},options:o3,plugins:[vline]});
}
function vForecast(){
 const H=D.holdout, f=D.forecast, names={naive:'Naive',drift_12m:'Drift (12-month slope)',ets_damped_log:'Damped ETS (log)'};
 const cols={naive:css('--amber'),drift_12m:css('--teal'),ets_damped_log:css('--coral')};
 $('#view').innerHTML=`<div class="grid">
 <div class="card c7"><h2>Holdout test: ${labL(H.months[0])} to ${labL(H.months[H.months.length-1])}</h2><p class="note">Models trained up to ${labL(M[N-7].d)} and asked to predict the next six months.</p><div class="chartbox"><canvas id="ho" role="img" aria-label="Holdout forecast versus actual"></canvas></div></div>
 <div class="card c5"><h2>Error on unseen months</h2><div class="scroll"><table><thead><tr><th>Model</th><th>MAPE</th></tr></thead><tbody>${Object.keys(names).map(k=>`<tr><td>${names[k]}${k===H.best?' <span class="pill up">selected</span>':''}</td><td><div class="mbar"><div class="track"><i style="width:${Math.min(100,H.mape[k]*15)}%;background:${cols[k]}"></i></div><b class="num">${H.mape[k].toFixed(2)}%</b></div></td></tr>`).join('')}</tbody></table></div><p class="note">MAPE is the average percentage miss. A simple trend line beat the fancier model on this window, so the simpler model is used.</p></div>
 <div class="card c12"><h2>Next six months</h2><div class="scroll"><table><thead><tr><th>Month</th><th>Forecast</th><th>Low (80%)</th><th>High (80%)</th></tr></thead><tbody>${f.map(x=>`<tr><td>${labL(x.d)}</td><td class="num"><b>${fV(x.f)}</b></td><td class="num">${fV(x.lo)}</td><td class="num">${fV(x.hi)}</td></tr>`).join('')}</tbody></table></div><p class="note">The band comes from recent month-to-month volatility and is approximate. It widens each month because errors compound, and it cannot anticipate policy changes such as fees or limits.</p></div></div>`;
 const o=base(); o.scales.y.ticks.callback=v=>+(v/1000).toFixed(1)+'B'; o.plugins.legend={display:true,labels:{color:css('--muted'),boxWidth:12,font:{family:css('--font'),size:11}}};
 o.plugins.tooltip.callbacks={label:c=>c.dataset.label+': '+fV(c.parsed.y)};
 mk('ho',{type:'line',data:{labels:H.months.map(labL),datasets:[{label:'Actual',data:H.actual,borderColor:css('--ink'),borderWidth:2.4,pointRadius:3,tension:.2},...Object.keys(names).map(k=>({label:names[k],data:H.pred[k],borderColor:cols[k],borderDash:[5,4],borderWidth:2,pointRadius:0,tension:.2}))]},options:o,plugins:[vline]});
}
function vRisk(){
 const A=D.anomalies.filter(a=>idx(a.d)>=S.from&&idx(a.d)<=S.to), fl=A.filter(a=>a.f).sort((a,b)=>b.s-a.s);
 $('#view').innerHTML=`<div class="grid">
 <div class="card c8"><div class="hero-h"><div><h2>Month-on-month growth against its own trend</h2><div class="big num">${fl.length}<small>flagged of ${A.length} months in range</small></div></div></div><div class="chartbox"><canvas id="an" role="img" aria-label="Monthly growth with flagged months"></canvas></div></div>
 <div class="card c4"><h2>How a month gets flagged</h2><p class="note">An Isolation Forest scores each month on two gaps: how far its volume growth is from the trailing 12-month median, and the same for ticket size. The most unusual 6% are flagged. Months before May 2018 are skipped because the trend needs a year of history.</p><p class="note">Flags mean unusual, not wrong. April 2020 is the lockdown dip and May 2020 the rebound.</p></div>
 <div class="card c12"><h2>Flagged months</h2><div class="scroll"><table><thead><tr><th>Month</th><th>Volume</th><th>Growth that month</th><th>Usual growth</th><th>Score</th></tr></thead><tbody>${fl.map(a=>`<tr><td><b>${labL(a.d)}</b></td><td class="num">${fV(a.v)}</td><td class="num">${fP(a.mom)}</td><td class="num">${fP(a.trend)}</td><td><span class="pill dn num">${a.s.toFixed(2)}</span></td></tr>`).join('')||'<tr><td colspan="5">No flagged months in this range.</td></tr>'}</tbody></table></div></div></div>`;
 const o=base(); o.scales.y.ticks.callback=v=>v+'%'; o.plugins.tooltip.callbacks={label:c=>c.dataset.label+': '+fP(c.parsed.y)};
 o.plugins.legend={display:true,labels:{color:css('--muted'),boxWidth:12,font:{family:css('--font'),size:11}}};
 mk('an',{type:'line',data:{labels:A.map(a=>lab(a.d)),datasets:[
  {label:'Growth that month',data:A.map(a=>a.mom),borderColor:css('--teal'),borderWidth:2,pointRadius:A.map(a=>a.f?6:0),pointBackgroundColor:A.map(a=>a.f?css('--coral'):css('--teal')),pointBorderColor:css('--card'),pointBorderWidth:2,pointHoverRadius:6,tension:.2},
  {label:'Usual growth',data:A.map(a=>a.trend),borderColor:css('--muted'),borderDash:[4,4],borderWidth:1.5,pointRadius:0,tension:.2}]},options:o,plugins:[vline]});
}
/* ------------------------------ ask the data ------------------------------ */
const MRX=/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)(?:uary|ruary|ch|il|e|y|ust|t|tember|ober|ember)?\b/;
const sum=(a,k)=>a.reduce((s,m)=>s+m[k],0);
function answer(q){
 const s=q.toLowerCase(), ys=[...s.matchAll(/\b(20\d\d)\b/g)].map(x=>+x[1]), mm=s.match(MRX), mo=mm?MN.findIndex(x=>x.toLowerCase()===mm[1]):-1, y=ys[0];
 const inY=yy=>M.filter(m=>+m.d.slice(0,4)===yy), one=(yy,mi)=>M.find(m=>+m.d.slice(0,4)===yy&&+m.d.slice(5)-1===mi);
 const has=r=>r.test(s), L=M[N-1];
 if(has(/anomal|unusual|outlier|flag|spike|dip/)){const f=D.anomalies.filter(a=>a.f); return {a:f.length+' months were flagged: '+f.map(a=>labL(a.d)+' ('+fP(a.mom)+' vs usual '+fP(a.trend)+')').join('; ')+'.',h:'Isolation Forest on detrended growth and ticket size.'};}
 if(has(/forecast|predict|next month|projection|expect/)){const f=D.forecast; return has(/next month/)?{a:labL(f[0].d)+': about '+fV(f[0].f)+' transactions (80% band '+fV(f[0].lo)+' to '+fV(f[0].hi)+').',h:'Drift model, selected on a 6-month holdout.'}:{a:f.map(x=>labL(x.d)+' '+fV(x.f)).join(', ')+'.',h:'Drift model refit on all data; 80% bands on the Forecast tab.'};}
 if(has(/season|festiv|diwali|best month|busiest|slowest|weakest/)){const e=Object.entries(D.season).sort((a,b)=>b[1]-a[1]); return {a:'After removing the growth trend, '+MFULL[e[0][0]-1]+' is busiest (index '+e[0][1].toFixed(3)+') and '+MFULL[e[e.length-1][0]-1]+' is weakest ('+e[e.length-1][1].toFixed(3)+'). Oct to Dec averages '+D.festive.festive_mean.toFixed(3)+' versus '+D.festive.other_mean.toFixed(3)+' for other months.',h:'Ratio to centred 12-month average; Mann-Whitney test.'};}
 if(has(/phase|stage|\bera\b|cluster|segment/)) return {a:D.phases.map(p=>p.name+': '+p.months+' months ('+p.from+' to '+p.to+')').join('; ')+'.',h:'K-means, k=3, on log volume.'};
 if(has(/ticket|per transaction|per payment|average (size|value)/)){
  if(y&&mo>=0&&one(y,mo)) return {a:'Average ticket in '+labL(one(y,mo).d)+': '+fT(one(y,mo).t)+'.',h:'Value divided by volume.'};
  if(y&&inY(y).length){const a=inY(y),t=sum(a,'c')*1e7/(sum(a,'v')*1e6); return {a:'Average ticket in '+y+': '+fT(t)+'.',h:'Year value divided by year volume.'};}
  return {a:'Average ticket fell from '+fT(M[0].t)+' ('+labL(M[0].d)+') to '+fT(L.t)+' ('+labL(L.d)+'), '+fP((L.t/M[0].t-1)*100,0)+'.',h:'Value divided by volume.'};}
 if(has(/bank/)){ if(y&&mo>=0&&one(y,mo)) return {a:one(y,mo).b+' banks were live in '+labL(one(y,mo).d)+'.',h:'num_banks column.'}; if(y&&inY(y).length){const a=inY(y); return {a:'Banks live in '+y+' went from '+a[0].b+' to '+a[a.length-1].b+'.',h:'num_banks column.'};} return {a:L.b+' banks live in '+labL(L.d)+', up from '+M[0].b+' in '+labL(M[0].d)+'.',h:'num_banks column.'};}
 if(ys.length>=2&&has(/compar|vs|versus|and|differ|against/)){const a=inY(ys[0]),b=inY(ys[1]); if(a.length&&b.length) return {a:ys[0]+': '+fV(sum(a,'v'))+' transactions; '+ys[1]+': '+fV(sum(b,'v'))+' ('+fP((sum(b,'v')/sum(a,'v')-1)*100)+').',h:'Sum of monthly volume.'};}
 if(has(/cagr|growth|grow|yoy|increase|rate/)){
  if(y&&inY(y).length&&inY(y-1).length){const g=(sum(inY(y),'v')/sum(inY(y-1),'v')-1)*100; return {a:'Volume in '+y+' grew '+fP(g)+' on '+(y-1)+' ('+fV(sum(inY(y-1),'v'))+' to '+fV(sum(inY(y),'v'))+').',h:'Sum of monthly volume, year over year.'};}
  const yrs=(N-1)/12, c=(Math.pow(L.v/M[0].v,1/yrs)-1)*100; return {a:'Volume CAGR is '+c.toFixed(1)+'% over '+yrs.toFixed(1)+' years. Latest year-on-year growth: '+fP(yoyAt(N-1))+'.',h:'(last/first)^(1/years) - 1.'};}
 if(has(/peak|highest|max|record|biggest/)){const p=M.reduce((a,m)=>m.v>a.v?m:a,M[0]); return {a:'Record month: '+labL(p.d)+' with '+fV(p.v)+' transactions worth '+fC(p.c)+'.',h:'Maximum of volume_mn.'};}
 if(has(/lowest|first|start|begin|smallest/)) return {a:'First month: '+labL(M[0].d)+' with '+fV(M[0].v)+' transactions, '+fC(M[0].c)+', across '+M[0].b+' banks.',h:'First row.'};
 if(has(/value|worth|amount|crore|money|rupee/)){
  if(y&&mo>=0&&one(y,mo)) return {a:fC(one(y,mo).c)+' in '+labL(one(y,mo).d)+'.',h:'value_cr column.'};
  if(y&&inY(y).length) return {a:fC(sum(inY(y),'c'))+' processed in '+y+'.',h:'Sum of value_cr.'};
  return {a:fC(L.c)+' in '+labL(L.d)+'.',h:'Latest month, value_cr.'};}
 if(has(/volume|transaction|txn|total|how many|count|payments/)){
  if(y&&mo>=0&&one(y,mo)) return {a:fV(one(y,mo).v)+' transactions in '+labL(one(y,mo).d)+'.',h:'volume_mn column.'};
  if(y&&inY(y).length){const a=inY(y); return {a:fV(sum(a,'v'))+' transactions in '+y+', about '+fV(sum(a,'v')/a.length)+' a month.',h:'Sum and mean of volume_mn.'};}
  return {a:fV(L.v)+' transactions in '+labL(L.d)+'. All-time total: '+fV(sum(M,'v'))+'.',h:'Latest month and sum of volume_mn.'};}
 return null;
}
function vAsk(){
 const ex=['What was the volume in March 2024?','How much did volume grow in 2023?','Compare 2024 and 2025','What is the average ticket size in 2022?','Which month is busiest?','Show the anomalies','Forecast next month','How many banks in 2020?','What is the CAGR?'];
 $('#view').innerHTML=`<div class="grid"><div class="card c12"><h2>Ask a question</h2><form class="askrow" id="askf"><input id="q" type="text" autocomplete="off" placeholder="e.g. What was the volume in March 2024?" aria-label="Question"><button class="btn" type="submit">Ask</button></form>
 <div class="chips">${ex.map(e=>`<button type="button">${e}</button>`).join('')}</div>
 <p class="note">Answers are calculated in your browser from the ${N} monthly rows on this page, using rules for the common question types. No AI model is called, so every answer shows how it was computed.</p></div>
 <div class="card c12"><h2>Answers</h2><div id="qa">${qaHtml()}</div></div></div>`;
 const run=t=>{t=t.trim(); if(!t) return; const r=answer(t); S.qa.unshift({q:t,a:r?r.a:'I could not match that question. Try asking about volume, value, growth, ticket size, banks, seasonality, forecast or anomalies, with a month or year if you like.',h:r?r.h:''}); $('#qa').innerHTML=qaHtml(); $('#q').value='';};
 $('#askf').onsubmit=e=>{e.preventDefault(); run($('#q').value);};
 document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>run(b.textContent));
}
const qaHtml=()=>S.qa.length?S.qa.map(x=>`<div class="qa"><div class="q">${x.q.replace(/</g,'&lt;')}</div><div class="a">${x.a}</div><div class="h">${x.h}</div></div>`).join(''):'<p class="note">Ask something above or tap an example.</p>';

/* ------------------------------ shell ------------------------------ */
function render(){
 killCharts();
 const [t,sb]=VIEWS[S.view]; $('#title').textContent=t; $('#subtitle').textContent=sb+' · '+labL(M[S.from].d)+' to '+labL(M[S.to].d);
 document.querySelectorAll('.nav').forEach(b=>b.setAttribute('aria-current',b.dataset.v===S.view?'page':'false'));
 $('#filters').style.display=S.view==='ask'||S.view==='forecast'?'none':'flex';
 ({market:vMarket,behaviour:vBehaviour,forecast:vForecast,risk:vRisk,ask:vAsk})[S.view]();
 try{history.replaceState(null,'','#'+S.view);}catch(e){}
}
function init(){
 $('#rail').innerHTML='<div class="logo">UPI 360</div>'+Object.entries(VIEWS).map(([k,v])=>`<button class="nav" data-v="${k}" title="${v[0]}"><svg viewBox="0 0 24 24" aria-hidden="true">${v[2]}</svg>${k==='ask'?'Ask':v[0]}</button>`).join('');
 document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{S.view=b.dataset.v; render();});
 const opts=M.map((m,i)=>`<option value="${i}">${labL(m.d)}</option>`).join('');
 $('#from').innerHTML=opts; $('#to').innerHTML=opts; $('#from').value=S.from; $('#to').value=S.to;
 const sync=()=>{ if(S.from>S.to){const t=S.from;S.from=S.to;S.to=t;} $('#from').value=S.from; $('#to').value=S.to; render(); };
 $('#from').onchange=e=>{S.from=+e.target.value; sync();}; $('#to').onchange=e=>{S.to=+e.target.value; sync();};
 document.querySelectorAll('#presets button').forEach(b=>b.onclick=()=>{const p=b.dataset.p; S.to=N-1; S.from=p==='all'?0:Math.max(0,N-+p); sync();});
 const h=location.hash.slice(1); if(VIEWS[h]) S.view=h;
 render();
 const re=()=>render(); try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',re);}catch(e){}
 new MutationObserver(re).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
}
init();
</script>
